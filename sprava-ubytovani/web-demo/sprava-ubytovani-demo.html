<title>Správa ubytování</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1d2433;--muted:#6b7385;--line:#e3e6ec;
  --pri:#2457d6;--pri-ink:#fff;--ok:#1a8a4a;--ok-bg:#e5f5ec;--warn:#a86a00;--warn-bg:#fff4dc;
  --bad:#c2312f;--bad-bg:#fde9e8;--info:#2457d6;--info-bg:#e8eefc;--side:#18202f;--side-ink:#cfd6e4;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#11151d;--card:#1a202b;--ink:#e6e9ef;--muted:#98a1b3;--line:#2b3342;
  --pri:#5b8cff;--ok:#4cc883;--ok-bg:#16301f;--warn:#e7ad3c;--warn-bg:#33280f;--bad:#ff6f6b;--bad-bg:#3a1a1a;
  --info:#7ea4ff;--info-bg:#1b2643;--side:#0c1017;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#11151d;--card:#1a202b;--ink:#e6e9ef;--muted:#98a1b3;--line:#2b3342;
  --pri:#5b8cff;--ok:#4cc883;--ok-bg:#16301f;--warn:#e7ad3c;--warn-bg:#33280f;--bad:#ff6f6b;--bad-bg:#3a1a1a;
  --info:#7ea4ff;--info-bg:#1b2643;--side:#0c1017;
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
h1,h2,h3{margin:0 0 .5em}
h2{font-size:20px}h3{font-size:15px}
.muted{color:var(--muted)}.small{font-size:12px}.err{color:var(--bad)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
#app{display:flex;min-height:100vh}
.side{width:220px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-weight:700;font-size:16px;padding:18px 18px 12px;color:#fff}
nav{flex:1;overflow:auto}
nav a{display:flex;justify-content:space-between;padding:9px 18px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
nav a:hover{background:#ffffff10}
nav a.on{background:#ffffff14;border-left-color:var(--pri);color:#fff}
nav .badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px}
.who{padding:14px 18px;border-top:1px solid #ffffff18;font-size:12px}
.who a{color:#9db8ff;cursor:pointer}
main{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top h2{margin:0;flex:1}
.menu{display:none}
#view{padding:20px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.tablewrap{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.alert{padding:9px 12px;border-radius:8px;margin-bottom:8px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.room{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--card);min-height:64px}
.room b{display:block}
.room .s{font-size:11px;color:var(--muted)}
.room.free{border-left:4px solid var(--ok)}
.room.part{border-left:4px solid var(--warn)}
.room.full{border-left:4px solid var(--pri)}
.room.maint{opacity:.55;border-left:4px solid var(--muted)}
.room.debt{box-shadow:inset 0 0 0 2px var(--bad)}
form label{display:block;margin-bottom:10px;font-size:12px;color:var(--muted)}
form label input,form label select,form label textarea{display:block;width:100%;margin-top:3px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
form label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
form label.chk input{width:auto;margin:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.modal-box{width:100%;max-width:560px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{width:100%;max-width:360px}
.login-card .btn{width:100%;margin-top:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90vw}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs .btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mb{margin-bottom:14px}
code{font-size:11px;word-break:break-all}
@media (max-width:800px){
  .side{position:fixed;left:-240px;z-index:15;transition:left .2s}
  .side.open{left:0}
  .menu{display:inline-block}
  #view{padding:14px 16px 60px}
  .top{padding:12px 16px}
  .f2{grid-template-columns:1fr}
}
@media print{.side,.top,.btn{display:none!important}#view{padding:0}.card{border:0}}
.receipt td{padding:4px 8px}
.demo-bar{background:var(--warn-bg);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}

</style>
<div class="demo-bar">Webová ukázka. Data jsou smyšlená a ukládají se jen ve vašem prohlížeči. <button class="btn sm" id="demoReset" type="button">Obnovit ukázková data</button></div>

<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <h1>Správa ubytování</h1>
    <label>Uživatel<input name="username" id="lu" autocomplete="username" value="majitel" required></label>
    <label>Heslo<input name="password" id="lp" type="password" autocomplete="current-password" value="majitel" required></label>
    <button class="btn primary">Přihlásit</button>
    <p class="muted small">Ukázkové účty: <b>majitel</b> / <b>majitel</b> (plná práva) nebo <b>spravce</b> / <b>spravce</b> (správce ubytovny a bytů).</p>
    <p id="loginErr" class="err"></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside class="side">
    <div class="brand">Správa ubytování</div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main>
    <header class="top"><button class="btn ghost menu" id="menuBtn">☰</button><h2 id="title"></h2><div id="actions"></div></header>
    <section id="view"></section>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-box card"><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>

<script>
"use strict";
/* Webová ukázka: věrný přepis server.py do JavaScriptu.
   Běží celé v prohlížeči, data se ukládají jen do prohlížeče návštěvníka (localStorage).
   Plná verze se serverem a databází je server.py. */
(function () {
  // ------------------------------------------------------------ SHA-256 (sync)
  function sha256(ascii) {
    const K = [], H = [];
    let n = 2, c = 0;
    const isP = x => { for (let i = 2; i * i <= x; i++) if (x % i === 0) return false; return true; };
    while (c < 64) { if (isP(n)) { if (c < 8) H[c] = (Math.pow(n, 1 / 2) * 2 ** 32) | 0; K[c++] = (Math.pow(n, 1 / 3) * 2 ** 32) | 0; } n++; }
    const bytes = new TextEncoder().encode(ascii);
    const l = bytes.length, words = [];
    for (let i = 0; i < l; i++) words[i >> 2] |= bytes[i] << ((3 - (i % 4)) * 8);
    words[l >> 2] |= 0x80 << ((3 - (l % 4)) * 8);
    const total = (((l + 8) >> 6) + 1) * 16;
    for (let i = words.length; i < total; i++) words[i] = words[i] | 0;
    words[total - 1] = l * 8;
    const h = H.slice();
    const r = (x, k) => (x >>> k) | (x << (32 - k));
    for (let j = 0; j < total; j += 16) {
      const w = words.slice(j, j + 16);
      let [a, b, cc, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        if (i >= 16) {
          const w15 = w[i - 15], w2 = w[i - 2];
          w[i] = (w[i - 16] + (r(w15, 7) ^ r(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (r(w2, 17) ^ r(w2, 19) ^ (w2 >>> 10))) | 0;
        }
        const t1 = (hh + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
        const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
      }
      [a, b, cc, d, e, f, g, hh].forEach((v, i) => h[i] = (h[i] + v) | 0);
    }
    return h.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
  }

  // ------------------------------------------------------------ dates
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const parseD = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const todayD = () => { const n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); };
  const addDays = (d, k) => new Date(d.getTime() + k * 864e5);
  const days = (a, b) => Math.round((b - a) / 864e5);
  const addMonths = (d, k) => {
    const m = d.getUTCMonth() + k, y = d.getUTCFullYear() + Math.floor(m / 12), mm = ((m % 12) + 12) % 12;
    const last = new Date(Date.UTC(y, mm + 1, 0)).getUTCDate();
    return new Date(Date.UTC(y, mm, Math.min(d.getUTCDate(), last)));
  };
  const nowIso = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}T${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`; };
  const round = x => Math.round(x * 100) / 100;

  // ------------------------------------------------------------ state
  const KEY = "sprava-ubytovani-demo-v1";
  const TABLES = ["users", "properties", "user_properties", "units", "persons", "stays", "payments", "expenses",
    "cash_transfers", "cash_closings", "approvals", "belongings", "room_entries", "audit"];
  let S;
  const fresh = () => { const s = { settings: { expense_limit: "2000", cash_tolerance: "50", rate_tolerance_pct: "10" }, sessions: {}, seq: {} }; TABLES.forEach(t => s[t] = []); return s; };
  function insert(t, row) { S.seq[t] = (S.seq[t] || 0) + 1; row.id = S.seq[t]; S[t].push(row); return row; }
  const get = (t, id) => S[t].find(r => r.id === Number(id));
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { } };
  const setting = k => Number(S.settings[k]);

  class ApiError extends Error { constructor(m, code = 400) { super(m); this.code = code; } }

  // ------------------------------------------------------------ audit chain
  function entryHash(prev, ts, uid, uname, action, entity, eid, det) {
    return sha256([prev, ts, uid ?? "None", uname, action, entity ?? "None", eid ?? "None", det].join("|"));
  }
  function audit(user, action, entity = null, entityId = null, details = {}) {
    const last = S.audit[S.audit.length - 1];
    const prev = last ? last.hash : "GENESIS";
    const ts = S._ts || nowIso();
    const uid = user ? user.id : null, uname = user ? user.username : "system";
    const det = JSON.stringify(Object.fromEntries(Object.keys(details).sort().map(k => [k, details[k]])));
    insert("audit", { ts, user_id: uid, username: uname, action, entity, entity_id: entityId, details: det, prev_hash: prev,
      hash: entryHash(prev, ts, uid, uname, action, entity, entityId, det) });
  }
  function verifyAudit() {
    let prev = "GENESIS", count = 0;
    for (const r of S.audit) {
      const h = entryHash(prev, r.ts, r.user_id, r.username, r.action, r.entity, r.entity_id, r.details);
      if (r.prev_hash !== prev || r.hash !== h) return { ok: false, broken_at: r.id, checked: count };
      prev = r.hash; count++;
    }
    const byYear = {};
    S.payments.forEach(p => { const [y, n] = p.receipt_no.split("-"); (byYear[y] = byYear[y] || []).push(+n); });
    const gaps = [];
    for (const [y, nums] of Object.entries(byYear)) {
      const set = new Set(nums), max = Math.max(...nums), missing = [];
      for (let i = 1; i <= max; i++) if (!set.has(i)) missing.push(i);
      if (missing.length) gaps.push({ year: y, missing: missing.slice(0, 50) });
    }
    return { ok: true, checked: count, last_hash: prev, receipt_gaps: gaps };
  }

  // ------------------------------------------------------------ business
  const allowed = u => u.role === "owner" ? S.properties.map(p => p.id) : S.user_properties.filter(x => x.user_id === u.id).map(x => x.property_id);
  const checkProp = (u, pid) => { if (!allowed(u).includes(Number(pid))) throw new ApiError("K tomuto objektu nemáte přístup", 403); };
  const need = (b, ...ks) => ks.forEach(k => { if (b[k] == null || b[k] === "") throw new ApiError("Chybí pole: " + k); });
  const num = (v, name = "částka", positive = true) => {
    const x = round(parseFloat(v));
    if (isNaN(x)) throw new ApiError("Neplatná " + name);
    if (positive && x <= 0) throw new ApiError(name[0].toUpperCase() + name.slice(1) + " musí být kladná");
    return x;
  };
  const occupiedCount = uid => S.stays.filter(s => s.unit_id === uid && !s.checkout_date).length;

  function stayExpected(st, upto) {
    const start = parseD(st.start_date);
    upto = upto || todayD();
    const ended = st.checkout_date && parseD(st.checkout_date) <= upto;
    let end = st.checkout_date ? parseD(st.checkout_date) : upto;
    if (end > upto) end = upto;
    if (end < start) return [0, 0];
    if (st.rate_type === "night") {
      const n = ended ? Math.max(1, days(start, end)) : days(start, end) + 1;
      return [round(n * st.rate), n];
    }
    const limit = ended ? end : addDays(end, 1);
    let k = 0;
    while (addMonths(start, k) < limit) k++;
    k = Math.max(k, 1);
    return [round(k * st.rate), k];
  }
  const refKind = p => p.kind === "storno" ? get("payments", p.ref_payment_id)?.kind : p.kind;
  const stayPaid = id => round(S.payments.filter(p => p.stay_id === id && refKind(p) === "rent").reduce((a, p) => a + p.amount, 0));
  const depositHeld = id => round(S.payments.filter(p => p.stay_id === id && ["deposit", "deposit_refund"].includes(refKind(p))).reduce((a, p) => a + p.amount, 0));
  function stayRow(s) {
    const p = get("persons", s.person_id), u = get("units", s.unit_id), pr = get("properties", u.property_id);
    return { ...s, person_name: p.name, person_phone: p.phone, unit_name: u.name, property_id: u.property_id, property_name: pr.name, property_type: pr.type };
  }
  function enrich(s) {
    const st = stayRow(s);
    const [exp, n] = stayExpected(st);
    st.expected = exp; st.periods = n; st.paid = stayPaid(st.id);
    st.balance = round(exp - st.paid); st.deposit_held = depositHeld(st.id); st.active = !st.checkout_date;
    return st;
  }
  function nextReceipt() {
    const y = todayD().getUTCFullYear();
    const nums = S.payments.filter(p => p.receipt_no.startsWith(y + "-")).map(p => +p.receipt_no.split("-")[1]);
    return `${y}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(6, "0")}`;
  }
  function insertPayment(user, kind, pid, amount, method, stayId = null, personId = null, note = "", ref = null, pdate = null) {
    const p = insert("payments", { receipt_no: nextReceipt(), kind, property_id: Number(pid), stay_id: stayId, person_id: personId,
      date: pdate || iso(todayD()), amount, method, note, ref_payment_id: ref, created_by: user.id, created_at: S._ts || nowIso() });
    audit(user, "payment_" + kind, "payment", p.id, { receipt: p.receipt_no, amount, method, stay: stayId, note, ref });
    return { ...p };
  }
  function cashState(pid) {
    const sum = a => a.reduce((x, r) => x + r.amount, 0);
    const inc = sum(S.payments.filter(p => p.property_id === pid && p.method === "cash"));
    const exp = sum(S.expenses.filter(e => e.property_id === pid && e.method === "cash" && e.status === "approved"));
    const pend = sum(S.expenses.filter(e => e.property_id === pid && e.method === "cash" && e.status === "pending"));
    const tr = sum(S.cash_transfers.filter(t => t.property_id === pid));
    const closings = S.cash_closings.filter(c => c.property_id === pid);
    const diffs = closings.reduce((a, c) => a + c.difference, 0);
    return { property_id: pid, income_cash: round(inc), expenses_cash: round(exp), pending_cash_expenses: round(pend), transfers: round(tr),
      differences_total: round(diffs), expected: round(inc - exp - tr + diffs), last_closing: closings[closings.length - 1] || null };
  }
  function requestApproval(user, type, payload, summary) {
    const a = insert("approvals", { type, payload, summary, status: "pending", requested_by: user.id, requested_at: S._ts || nowIso(),
      decided_by: null, decided_at: null, decision_note: "" });
    audit(user, "approval_request", "approval", a.id, { type, summary, ...payload });
    return a.id;
  }
  function executeApproval(a, owner) {
    const p = a.payload;
    if (a.type === "payment_storno") {
      const o = get("payments", p.payment_id);
      if (S.payments.some(x => x.ref_payment_id === o.id && x.kind === "storno")) throw new ApiError("Platba už byla stornována");
      insertPayment(owner, "storno", o.property_id, -o.amount, o.method, o.stay_id, o.person_id, `Storno dokladu ${o.receipt_no}: ${p.reason}`, o.id);
    } else if (a.type === "deposit_refund") {
      const st = stayRow(get("stays", p.stay_id));
      const held = depositHeld(st.id);
      if (p.amount > held + 0.001) throw new ApiError(`Na kauci je jen ${held} Kč`);
      insertPayment(owner, "deposit_refund", st.property_id, -p.amount, p.method, st.id, st.person_id, "Vrácení kauce: " + (p.reason || ""));
    } else if (a.type === "expense") {
      const e = get("expenses", p.expense_id);
      if (e.method === "cash" && e.amount > cashState(e.property_id).expected + 0.001)
        throw new ApiError("V pokladně podle evidence není na tento hotovostní výdaj dost peněz – zamítněte ho nebo nejdřív zkontrolujte pokladnu");
      e.status = "approved";
    } else if (a.type === "rate_discount") {
      get("stays", p.stay_id).rate = p.rate;
    }
  }

  // ------------------------------------------------------------ routes
  const R = [];
  const route = (m, pat, fn, opt = {}) => R.push({ m, parts: pat.split("/").filter(Boolean), fn, owner: !!opt.owner, auth: opt.auth !== false });
  const userName = id => get("users", id)?.name || "";
  const propName = id => get("properties", id)?.name || "";
  const byIdDesc = (a, b) => b.id - a.id;

  route("POST", "/api/login", (u, b) => {
    const usr = S.users.find(x => x.username === b.username && x.active);
    if (!usr || usr.password !== b.password) throw new ApiError("Špatné jméno nebo heslo", 401);
    const tok = "t" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    S.sessions[tok] = usr.id;
    audit(usr, "login");
    return { token: tok };
  }, { auth: false });
  route("POST", "/api/logout", u => { audit(u, "logout"); return { ok: true }; });
  route("GET", "/api/me", u => ({ id: u.id, username: u.username, name: u.name, role: u.role, must_change_pw: 0, properties: allowed(u) }));
  route("POST", "/api/me/password", (u, b) => {
    need(b, "old", "new");

  function monthReport(ids, ym) {

    const s0 = iso(start), s1 = iso(end), td = todayD();
    return ids.map(pid => {
      let expected = 0;
      S.stays.map(stayRow).filter(st => st.property_id === pid && st.start_date <= s1 && (!st.checkout_date || st.checkout_date >= s0)).forEach(st => {
        const upto = end < td ? end : td;
        if (upto < start) return;
        const a = stayExpected(st, upto)[0];
        const bb = parseD(st.start_date) < start ? stayExpected(st, addDays(start, -1))[0] : 0;
        expected += a - bb;

      if (moved && (!last || new Date(last.created_at).getTime() < dayAgo)) alerts.push({ level: "warn", text: `${c.property_name}: pokladna nebyla uzavřena přes 24 h` });
      if (last && Math.abs(last.difference) > setting("cash_tolerance")) alerts.push({ level: "bad", text: `${c.property_name}: poslední uzávěrka s rozdílem ${last.difference} Kč` });
    });
    const pend = u.role === "owner" ? S.approvals.filter(a => a.status === "pending").length : 0;
    if (pend) alerts.push({ level: "warn", text: `${pend} žádostí čeká na vaše schválení` });
    const since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 19);
    const stornos = S.payments.filter(p => p.kind === "storno" && p.created_at >= since && ids.includes(p.property_id)).length;
    if (stornos >= 3) alerts.push({ level: "bad", text: `${stornos} storen plateb za posledních 7 dní – zkontrolujte` });
    const ent = S.room_entries.filter(e => e.entered_at >= since && !e.tenant_present && ids.includes(get("units", e.unit_id).property_id)).length;
    if (ent) alerts.push({ level: "info", text: `${ent}× vstup do pokoje bez přítomnosti nájemníka za 7 dní` });
    return {
      properties: props.map(p => ({ id: p.id, name: p.name, type: p.type, capacity: p.capacity, occupied: p.occupied })),
      debt_total: round(debts.reduce((a, s) => a + s.balance, 0)), debts: debts.slice(0, 15),

  route("GET", "/api/audit", (u, b, q) => {

    return S.audit.filter(r => !t || [r.action, r.username, r.details].some(x => (x || "").toLowerCase().includes(t))).slice().reverse().slice(0, lim);
  }, { owner: true });
  route("GET", "/api/audit/verify", u => { const r = verifyAudit(); audit(u, "audit_verify", null, null, { ok: r.ok, checked: r.checked }); return r; }, { owner: true });
  route("GET", "/api/backup", () => { throw new ApiError("Zálohy dělá plná verze programu (server.py). Webová ukázka ukládá data jen do vašeho prohlížeče."); }, { owner: true });

  // ------------------------------------------------------------ dispatcher
  function handle(path, method, body, token) {
    const [p, qs] = path.split("?");

    const parts = p.split("/").filter(Boolean);
    for (const r of R) {
      if (r.m !== method || r.parts.length !== parts.length) continue;
      let ok = true, id;
      r.parts.forEach((a, i) => { if (a.startsWith(":")) { if (!/^\d+$/.test(parts[i])) ok = false; else id = +parts[i]; } else if (a !== parts[i]) ok = false; });
      if (!ok) continue;
      const snapshot = JSON.stringify(S);
      try {
        const user = get("users", S.sessions[token]);
        if (r.auth && !(user && user.active)) throw new ApiError("Nepřihlášen", 401);
        if (r.owner && user.role !== "owner") throw new ApiError("Jen pro majitele", 403);
        const data = JSON.parse(JSON.stringify(r.fn(user, body || {}, q, id) ?? null));
        if (method !== "GET" || path.startsWith("/api/audit/verify")) save();
        return { status: 200, data };
      } catch (e) {

        if (e instanceof ApiError) {

        }
        console.error(e);

<script>
"use strict";
// ---------------------------------------------------------------- utilities
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const kc = n => (Number(n) || 0).toLocaleString("cs-CZ", { maximumFractionDigits: 2 }) + " Kč";
const dt = s => s ? new Date(s.length <= 10 ? s + "T00:00" : s).toLocaleDateString("cs-CZ") : "";
const dtt = s => s ? new Date(s).toLocaleString("cs-CZ", { dateStyle: "short", timeStyle: "short" }) : "";
const todayIso = () => new Date().toISOString().slice(0, 10);
const METHOD = { cash: "Hotově", bank: "Převodem", card: "Kartou" };
const KIND = { rent: "Nájem/ubytování", deposit: "Kauce", deposit_refund: "Vrácení kauce", storno: "Storno", other: "Ostatní příjem" };
const PTYPE = { hostel: "Ubytovna", hotel: "Hotel", apartments: "Byty" };
const UKIND = { single: "1lůžkový", double: "2lůžkový", room: "Pokoj", apartment: "Byt" };
const APPR = { payment_storno: "Storno platby", deposit_refund: "Vrácení kauce", expense: "Výdaj", rate_discount: "Sleva / změna ceny" };
const EXP_CAT = ["Opravy a údržba", "Úklid a drogerie", "Energie", "Materiál", "Vybavení", "Služby", "Poplatky", "Ostatní"];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let TOKEN = store.get("token") || "";
let ME = null, PROPS = [], CACHE = {};

async function api(path, opts = {}) {
  if (window.DEMO_API) {  // webová ukázka: "server" běží přímo v prohlížeči
    const r = window.DEMO_API(path, opts.method || (opts.body ? "POST" : "GET"), opts.body, TOKEN);
    if (r.status === 401 && path !== "/api/login") { logoutLocal(); throw new Error(r.data.error); }
    if (r.status !== 200) throw new Error(r.data.error || "Chyba");
    return r.data;
  }
  const r = await fetch(path, {
    method: opts.method || (opts.body ? "POST" : "GET"),
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + TOKEN },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({ error: "Chybná odpověď serveru" }));
  if (r.status === 401 && path !== "/api/login") { logoutLocal(); throw new Error(data.error); }
  if (!r.ok) throw new Error(data.error || "Chyba");
  return data;
}
function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add("hidden"), ms); }
function closeModal() { $("#modal").classList.add("hidden"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

/** Otevře formulář v modálním okně. fields: [{n,l,t,opts,req,v,help}] */
function form(title, fields, onSubmit, { submit = "Uložit", intro = "" } = {}) {
  const f = fields.map(x => {
    const req = x.req ? "required" : "";
    const v = x.v ?? "";
    if (x.t === "html") return x.html;
    if (x.t === "select") return `<label>${esc(x.l)}<select name="${x.n}" ${req}>${x.opts.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>${x.help ? `<span class="small">${esc(x.help)}</span>` : ""}</label>`;
    if (x.t === "textarea") return `<label>${esc(x.l)}<textarea name="${x.n}" rows="3" ${req}>${esc(v)}</textarea></label>`;
    if (x.t === "check") return `<label class="chk"><input type="checkbox" name="${x.n}" ${v ? "checked" : ""}> ${esc(x.l)}</label>`;
    return `<label>${esc(x.l)}<input name="${x.n}" type="${x.t || "text"}" value="${esc(v)}" ${x.t === "number" ? 'step="0.01"' : ""} ${req}>${x.help ? `<span class="small">${esc(x.help)}</span>` : ""}</label>`;
  }).join("");
  $("#modalBody").innerHTML = `<h3>${esc(title)}</h3>${intro}<form id="mf">${f}<p id="mfErr" class="err"></p>
    <div class="row"><button class="btn primary">${esc(submit)}</button><button type="button" class="btn" onclick="closeModal()">Zrušit</button></div></form>`;
  $("#modal").classList.remove("hidden");
  const el = $("#mf");
  el.querySelector("input,select,textarea")?.focus();
  el.onsubmit = async e => {
    e.preventDefault();
    const data = {};
    for (const x of fields) {
      if (!x.n) continue;
      const inp = el.elements[x.n];
      data[x.n] = x.t === "check" ? inp.checked : inp.value;
    }
    try { const btn = el.querySelector(".primary"); btn.disabled = true; await onSubmit(data); closeModal(); }
    catch (err) { $("#mfErr").textContent = err.message; el.querySelector(".primary").disabled = false; }
  };
}
function table(cols, rows, { onClick, empty = "Žádné záznamy" } = {}) {
  if (!rows.length) return `<p class="muted">${empty}</p>`;
  const id = "t" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    if (!onClick) return;
    document.querySelectorAll(`#${id} tr[data-i]`).forEach(tr => tr.onclick = e => { if (!e.target.closest("button")) onClick(rows[tr.dataset.i]); });
  });
  return `<div class="tablewrap"><table id="${id}"><thead><tr>${cols.map(c => `<th class="${c.num ? "num" : ""}">${esc(c.l)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r, i) => `<tr data-i="${i}" class="${onClick ? "click" : ""}">${cols.map(c => `<td class="${c.num ? "num" : ""}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
const propOpts = () => PROPS.map(p => [p.id, p.name]);

const isOwner = () => ME?.role === "owner";

// ---------------------------------------------------------------- routing
const PAGES = [

  ["audit", "Audit (kontrola)", viewAudit, true],

];
let pendingCount = 0;
function renderNav() {
  const cur = location.hash.slice(1) || "prehled";
  $("#nav").innerHTML = PAGES.filter(p => !p[3] || isOwner()).map(p =>
    `<a href="#${p[0]}" class="${p[0] === cur ? "on" : ""}">${p[1]}${p[0] === "schvalovani" && pendingCount ? `<span class="badge">${pendingCount}</span>` : ""}</a>`).join("");

function actions(btns) {

// ---------------------------------------------------------------- auth
function logoutLocal() { TOKEN = ""; store.del("token"); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const r = await api("/api/login", { body: { username: fd.get("username"), password: fd.get("password") } });
    TOKEN = r.token; store.set("token", TOKEN); $("#loginErr").textContent = ""; e.target.reset(); start();
  } catch (err) { $("#loginErr").textContent = err.message; }

    { n: "deposit_paid", l: "Kauci platí teď", t: "select", opts: [["", "ne"], ["cash", "ano – hotově"], ["bank", "ano – převodem"]] },
    { t: "html", html: `</div>` },
    { n: "note", l: "Poznámka", t: "textarea" },

    }

  const [y, m] = month.split("-").map(Number);
  const last = new Date(y, m, 0).getDate();
  const rows = await api(`/api/payments?from=${month}-01&to=${month}-${String(last).padStart(2, "0")}`);
  actions([["+ Ostatní příjem", () => form("Ostatní příjem (bez pobytu)", [
    { n: "property_id", l: "Objekt", t: "select", opts: propOpts() }, { n: "amount", l: "Částka", t: "number", req: 1 },
    { n: "method", l: "Způsob", t: "select", opts: Object.entries(METHOD) }, { n: "note", l: "Za co", req: 1 },
  ], async d => { const p = await api("/api/payments", { body: { ...d, kind: "other" } }); printReceipt(p); reload(); })]]);
  const sum = k => rows.filter(r => r.method === k).reduce((a, r) => a + r.amount, 0);
  v.innerHTML = `<div class="row mb"><label class="muted">Měsíc <input type="month" id="pm" value="${month}"></label>
    <span class="pill">hotově ${kc(sum("cash"))}</span><span class="pill">převodem ${kc(sum("bank"))}</span><span class="pill">kartou ${kc(sum("card"))}</span></div>
    <p class="small muted">Platby nelze upravit ani smazat. Chybu opravíte stornem, které schvaluje majitel. Čísla dokladů jdou souvisle za sebou.</p>
    <div class="card">${table([
      { l: "Doklad", k: "receipt_no" }, { l: "Datum", f: r => dt(r.date) }, { l: "Objekt", k: "property_name" }, { l: "Plátce", k: "person_name" },
      { l: "Druh", f: r => KIND[r.kind] + (r.storno_receipt ? ` <span class="pill bad">stornováno ${esc(r.storno_receipt)}</span>` : "") },
      { l: "Způsob", f: r => METHOD[r.method] }, { l: "Částka", num: 1, f: r => kc(r.amount) }, { l: "Zapsal", k: "created_by_name" },
      { l: "", f: r => ["rent", "deposit", "other"].includes(r.kind) && !r.storno_receipt ? `<button class="btn sm danger" data-st="${r.id}">Storno</button> <button class="btn sm" data-pr="${r.id}">Tisk</button>` : "" },
    ], rows)}</div>`;
  $("#pm").onchange = e => { v.dataset.m = e.target.value; viewPayments(v); };
  v.querySelectorAll("[data-st]").forEach(b => b.onclick = () => form("Storno platby", [{ n: "reason", l: "Důvod storna", t: "textarea", req: 1 }],
    async d => { toast((await api(`/api/payments/${b.dataset.st}/storno`, { body: d })).message); reload(); }));
  v.querySelectorAll("[data-pr]").forEach(b => b.onclick = () => printReceipt(rows.find(r => r.id == b.dataset.pr)));
}

    <div class="grid g2">${r.rows.map(x => `<div class="card"><h3>Výdaje – ${esc(x.property_name)}</h3>${table([{ l: "Kategorie", k: "category" }, { l: "Částka", num: 1, f: c => kc(c.s) }], x.expenses_by_category, { empty: "Bez výdajů" })}</div>`).join("")}</div>

      <label>Výdaje nad tuto částku schvaluje majitel (Kč)<input name="expense_limit" type="number" value="${esc(st.expense_limit)}"></label>
      <label>Tolerovaný rozdíl v pokladně bez vysvětlení (Kč)<input name="cash_tolerance" type="number" value="${esc(st.cash_tolerance)}"></label>
      <label>Sleva pod ceník nad tolik % jde ke schválení<input name="rate_tolerance_pct" type="number" value="${esc(st.rate_tolerance_pct)}"></label>
      <button class="btn primary">Uložit pravidla</button></form>
      <p class="small muted">Každá změna pravidel se zapisuje do auditu.</p></div></div>`;
  $("#sf").onsubmit = async e => { e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target)); await api("/api/settings", { method: "PUT", body: fd }); toast("Pravidla uložena"); };
}

if (TOKEN) start(); else logoutLocal();

document.getElementById("demoReset").onclick = () => { window.DEMO_RESET(); store.del("token"); location.hash = ""; location.reload(); };
</script>
